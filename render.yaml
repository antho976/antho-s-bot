# Render Blueprint — one always-on web service running the Docker image,
# with a persistent disk for the SQLite file (planning/02-hosting-cost.md, Path A).
services:
  - type: web
    name: anthos-bot
    runtime: docker
    # US-East — closest to Discord's infra, ~50-100ms lower interaction latency than Oregon.
    # Region is set only when a service is CREATED; Render can't move an existing service, so
    # changing this means recreating the service (see MIGRATION.md). Fallback: ohio.
    region: virginia
    plan: starter # ~$7/mo, always-on (free tier sleeps — bad for a bot)
    healthCheckPath: /
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/data/bot.db # lives on the persistent disk
      - key: AUTH_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false # set to your Render URL after first deploy
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      # Multi-server: comma-separated guild IDs (first = primary). Overrides DISCORD_GUILD_ID.
      - key: DISCORD_GUILD_IDS
        sync: false
      # Per-guild feature kill-switch, e.g. `222...:ai,rpg` (see .env.example / server/core/guilds).
      - key: DISCORD_DISABLED_FEATURES
        sync: false
      - key: LOG_RETENTION_DAYS
        value: "14"
